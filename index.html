<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Central — Control de Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBsbQ-Ze5jcSLDHDR2jswLpCNFNZgpQAKQ",
    authDomain: "la-central-b9be2.firebaseapp.com",
    databaseURL: "https://la-central-b9be2-default-rtdb.firebaseio.com",
    projectId: "la-central-b9be2",
    storageBucket: "la-central-b9be2.firebasestorage.app",
    messagingSenderId: "113403362737",
    appId: "1:113403362737:web:222cb10b6a2d56c4a79190"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  // Fuerza un tipo de conexión más compatible con redes móviles/celulares
  // que bloquean el streaming normal de Firestore (evita que se quede "Conectando..." para siempre)
  db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false });
  // Permite que la app siga funcionando sin internet y sincronice cuando vuelva
  db.enablePersistence({ synchronizeTabs: true }).catch(err => {
    console.warn('Persistencia offline no disponible en esta pestaña:', err.code);
  });
</script>
<style>
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F5F5F7;
  --surface-3:#EFEFF1;
  --border:#EAEAEA;
  --text:#222222;
  --text-dim:#666666;
  --text-faint:#9A9AA0;
  --accent:#E53935;
  --accent-2:#FF5A54;
  --accent-dim:#FDECEA;
  --secondary:#FFC107;
  --secondary-dim:#FFF6DD;
  --danger:#E53935;
  --danger-bg:#FDECEA;
  --success:#34C759;
  --success-bg:#E9FBEE;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", 'Inter', sans-serif;
  --font-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", 'Inter', sans-serif;
  --font-mono:'Inter', -apple-system, sans-serif;
  --radius:20px;
  --radius-sm:14px;
  --radius-lg:24px;
  --shadow-sm:0 1px 3px rgba(20,20,25,0.05), 0 1px 2px rgba(20,20,25,0.04);
  --shadow-md:0 8px 24px rgba(20,20,25,0.08), 0 2px 6px rgba(20,20,25,0.04);
  --shadow-lg:0 16px 40px rgba(20,20,25,0.12);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
::selection{background:var(--accent-dim);color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

.app{max-width:1180px;margin:0 auto;padding:28px 20px 70px;}

/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:8px 4px 26px;border-bottom:none;
  margin-bottom:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{
  width:48px;height:48px;border-radius:16px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2) 55%, var(--secondary));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;color:#fff;font-size:17px;letter-spacing:0.2px;
  box-shadow:var(--shadow-md);
  flex-shrink:0;
}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-0.3px;color:var(--text);}
.brand p{margin:2px 0 0;color:var(--text-dim);font-size:13px;font-weight:500;}
.header-right{display:flex;gap:8px;align-items:center;}
.clock{
  font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--text-dim);text-align:right;
  background:var(--surface-2);padding:8px 14px;border-radius:999px;white-space:nowrap;
}
#syncBadge{color:var(--text);}

/* Tabs */
.tabs{
  display:flex;gap:5px;margin-bottom:24px;border-bottom:none;
  overflow-x:auto;background:var(--surface-2);padding:5px;border-radius:999px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  font-family:var(--font-body);font-weight:600;font-size:12.5px;color:var(--text-dim);
  background:none;border:none;padding:8px 13px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  border-radius:999px;transition:background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
  letter-spacing:0.1px;
}
.tab:hover{color:var(--text);}
.tab.active{color:#fff;background:var(--accent);box-shadow:0 4px 12px rgba(229,57,53,0.28);}

.panel{display:none;animation:fadeScale .3s var(--ease);}
.panel.active{display:block;}
@keyframes fadeScale{from{opacity:0;transform:translateY(6px) scale(0.99);}to{opacity:1;transform:translateY(0) scale(1);}}

/* Cards / surfaces */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;margin-bottom:18px;box-shadow:var(--shadow-sm);
  transition:box-shadow .25s var(--ease);
}
.card h2{
  font-family:var(--font-display);font-weight:700;font-size:18px;margin:0 0 4px;color:var(--text);letter-spacing:-0.2px;
}
.card .sub{color:var(--text-dim);font-size:13px;margin:0 0 18px;font-weight:500;}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:end;}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);font-weight:700;}
input,select{
  background:var(--surface-2);border:1.5px solid transparent;color:var(--text);
  padding:12px 14px;border-radius:var(--radius-sm);font-size:14.5px;font-family:var(--font-body);
  width:100%;transition:border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
}
input:focus,select:focus{
  outline:none;border-color:var(--accent);background:#fff;
  box-shadow:0 0 0 4px rgba(229,57,53,0.10);
}
input::placeholder{color:var(--text-faint);}
input[type="date"]{color-scheme:light;}

.btn{
  font-family:var(--font-body);font-weight:700;font-size:13.5px;
  padding:12px 20px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;
  transition:filter .2s var(--ease), transform .12s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(229,57,53,0.28);}
.btn-primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px rgba(229,57,53,0.34);transform:translateY(-1px);}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);border-color:#D8D8DC;box-shadow:var(--shadow-sm);}
.btn-danger{background:var(--danger-bg);border-color:transparent;color:var(--danger);padding:7px 13px;font-size:12px;border-radius:12px;}
.btn-danger:hover{background:#FBDAD8;}
.btn-sm{padding:7px 13px;font-size:12px;}

/* Table: columnas reales en pantallas anchas, tarjetas apiladas en móvil (ver media query más abajo) */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-sm);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
thead{display:table-header-group;}
thead th{
  text-align:left;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-faint);
  white-space:nowrap;
  position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--border);
}
thead th.right{text-align:right;}
thead th:first-child{border-top-left-radius:var(--radius-lg);}
thead th:last-child{border-top-right-radius:var(--radius-lg);}
tbody tr{
  background:var(--surface);border:none;border-radius:0;padding:0;margin-bottom:0;box-shadow:none;
  border-bottom:1px solid var(--border);transition:background .18s var(--ease);
}
tbody tr:hover{background:var(--surface-2);box-shadow:none;transform:none;}
tbody tr:last-child{border-bottom:none;}
tbody tr.cat-row{background:var(--surface-2);}
tbody tr.cat-row:hover{background:var(--surface-2);}
tbody tr.cat-row td{padding:10px 18px;}
td{padding:13px 18px;border-bottom:none;text-align:left;vertical-align:middle;white-space:nowrap;}
td::before{content:none;}
td.empty{display:table-cell;text-align:center;padding:38px 20px;color:var(--text-faint);font-weight:500;font-size:13.5px;white-space:normal;}
.cat-row td{
  background:none;font-family:var(--font-display);font-weight:800;
  color:var(--accent);font-size:12.5px;letter-spacing:0.5px;text-transform:uppercase;
}
/* Colores suaves por categoría (el tono --cat-h lo calcula el JS para cada categoría) */
tbody tr.cat-row[style*="--cat-h"]{
  background:hsl(var(--cat-h) 68% 91%) !important;
  border-radius:10px;
}
tbody tr.cat-row[style*="--cat-h"] td{
  color:hsl(var(--cat-h) 55% 32%) !important;
}
tbody tr:not(.cat-row)[style*="--cat-h"]{
  background:hsl(var(--cat-h) 55% 97.5%);
  border-left:3px solid hsl(var(--cat-h) 55% 78%);
}
tbody tr:not(.cat-row)[style*="--cat-h"]:hover{
  background:hsl(var(--cat-h) 55% 95%) !important;
}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;}
.cell-label{display:none;}
@media (min-width:901px){
  td.labeled{vertical-align:middle;}
  td.labeled .cell-label{
    display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:0.4px;
    color:var(--text-faint);font-weight:700;margin-bottom:3px;
  }
  td.labeled .cell-value{display:block;}
}
.right{text-align:right;}
.muted{color:var(--text-faint);}

@media (max-width:900px){
  .table-wrap{overflow-x:visible;border:none;border-radius:0;background:transparent;box-shadow:none;}
  table{min-width:0;}
  thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tbody tr{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:6px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);
  }
  tbody tr:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);background:var(--surface);}
  tbody tr:last-child{margin-bottom:0;}
  tbody tr.cat-row{background:transparent;border:none;box-shadow:none;padding:22px 4px 8px;margin:0 0 4px;}
  tbody tr.cat-row:hover{transform:none;background:transparent;}
  tbody tr.cat-row td{
    display:block;padding:0;border:none;color:var(--accent);font-weight:800;
    font-size:12.5px;letter-spacing:0.6px;text-transform:uppercase;font-family:var(--font-display);
  }
  tbody tr.cat-row[style*="--cat-h"]{background:transparent !important;padding:22px 4px 8px;}
  tbody tr.cat-row[style*="--cat-h"] td{color:hsl(var(--cat-h) 55% 38%) !important;}
  tbody tr:not(.cat-row)[style*="--cat-h"]{border-left:4px solid hsl(var(--cat-h) 55% 78%);}
  td{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:11px 0;border-bottom:1px solid var(--border);text-align:left;white-space:normal;
  }
  td:last-child{border-bottom:none;}
  td::before{
    content:attr(data-label);font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.4px;color:var(--text-faint);flex-shrink:0;
  }
  td.empty{display:block;white-space:normal;}
  td.empty::before{content:none;}
}

/* Stock gauge */
.gauge-wrap{display:flex;align-items:center;gap:8px;}
.gauge{width:56px;height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;flex-shrink:0;}
.gauge-fill{height:100%;border-radius:6px;transition:width .3s var(--ease);}
.badge{
  display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:800;
  letter-spacing:0.3px;text-transform:uppercase;
}
.badge-low{background:var(--danger-bg);color:var(--accent);}
.badge-ok{background:var(--success-bg);color:#1F9E45;}

/* Dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:18px;}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:22px 22px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
  transition:box-shadow .25s var(--ease), transform .25s var(--ease);
}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);}
.kpi::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:var(--border);
}
.kpi.positive::before{background:var(--success);}
.kpi.warn::before{background:var(--accent);}
.kpi-label{font-size:12px;color:var(--text-dim);margin-bottom:10px;font-weight:600;letter-spacing:0.1px;}
.kpi-value{font-family:var(--font-display);font-size:27px;font-weight:800;color:var(--text);letter-spacing:-0.4px;}
.kpi-value.small{font-size:21px;}
.kpi.positive .kpi-value::after{content:' \25B2';font-size:13px;color:var(--success);font-weight:700;}
.kpi.warn .kpi-value::after{content:' \25BC';font-size:13px;color:var(--accent);font-weight:700;}

.lowstock-list{list-style:none;margin:0;padding:0;}
.lowstock-list li{
  display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border);font-size:14px;font-weight:500;
}
.lowstock-list li:last-child{border-bottom:none;}

.empty{color:var(--text-faint);font-size:13.5px;padding:30px;text-align:center;font-weight:500;}

.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.toolbar .search{max-width:260px;}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(34,34,34,0.94);border:none;color:#fff;backdrop-filter:blur(10px);
  padding:13px 22px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:all .3s var(--ease);z-index:50;font-weight:600;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ Modal (reemplazo de confirm/prompt nativos) ============ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(20,20,24,0);backdrop-filter:blur(0px);
  transition:background .28s var(--ease), backdrop-filter .28s var(--ease);
  opacity:0;
}
.modal-overlay.show{background:rgba(20,20,24,0.46);backdrop-filter:blur(3px);opacity:1;}
.modal-overlay.hide{background:rgba(20,20,24,0);backdrop-filter:blur(0px);opacity:0;}
.modal-box{
  background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:380px;padding:26px 26px 22px;text-align:center;
  transform:translateY(18px) scale(0.94);opacity:0;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1), opacity .24s var(--ease);
}
.modal-overlay.show .modal-box{transform:translateY(0) scale(1);opacity:1;}
.modal-overlay.hide .modal-box{transform:translateY(10px) scale(0.96);opacity:0;transition:transform .18s var(--ease), opacity .18s var(--ease);}
.modal-icon{
  width:52px;height:52px;border-radius:16px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:var(--accent-dim);color:var(--accent);
  animation:modalIconPop .4s var(--ease) .05s backwards;
}
.modal-icon.danger{background:var(--danger-bg);color:var(--danger);}
@keyframes modalIconPop{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-title{
  font-family:var(--font-display);font-weight:800;font-size:17.5px;margin:0 0 8px;
  color:var(--text);letter-spacing:-0.2px;
}
.modal-message{
  color:var(--text-dim);font-size:13.5px;line-height:1.55;margin:0 0 6px;font-weight:500;
  white-space:pre-line;
}
.modal-meta{
  display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);
  border-radius:var(--radius-sm);padding:12px 14px;margin:14px 0 4px;text-align:left;
}
.modal-meta div{display:flex;flex-direction:column;gap:3px;}
.modal-meta .lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);font-weight:700;}
.modal-meta .val{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--text);}
.modal-input{
  background:var(--surface-2);border:1.5px solid transparent;color:var(--text);
  padding:13px 14px;border-radius:var(--radius-sm);font-size:16px;font-family:var(--font-body);
  font-weight:700;width:100%;margin-top:14px;text-align:center;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
}
.modal-input:focus{
  outline:none;border-color:var(--accent);background:#fff;
  box-shadow:0 0 0 4px rgba(229,57,53,0.10);
}
.modal-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;text-align:left;}
.modal-fields .field{gap:6px;}
.modal-fields .modal-input{margin-top:0;text-align:left;font-size:14.5px;}
.modal-actions{display:flex;gap:10px;margin-top:22px;}
.modal-actions .btn{flex:1;padding:13px 16px;}
.btn-danger-solid{background:var(--danger);color:#fff;box-shadow:0 4px 14px rgba(229,57,53,0.28);}
.btn-danger-solid:hover{filter:brightness(1.06);box-shadow:0 6px 18px rgba(229,57,53,0.34);transform:translateY(-1px);}
@media (max-width:480px){
  .modal-box{padding:22px 20px 18px;}
  .modal-actions{flex-direction:column-reverse;}
  .modal-fields{grid-template-columns:1fr;}
}

@media (max-width:640px){
  .header{flex-direction:column;align-items:flex-start;}
  .brand h1{font-size:21px;}
  .kpi-value{font-size:23px;}
  .card{padding:18px;border-radius:var(--radius);}
  td{font-size:13.5px;}
  .tabs{gap:4px;padding:4px;margin-bottom:18px;}
  .tab{padding:7px 11px;font-size:11.5px;}

  .header-right{
    width:100%;flex-wrap:wrap;gap:8px;
  }
  .header-right > *{
    flex:1 1 calc(50% - 4px);
    box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    text-align:center;white-space:normal;
    margin:0;
  }
}

@media (max-width:380px){
  .header-right > *{
    flex:1 1 100%;
  }
}

/* ============ Login ============ */
.login-screen{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:#FFF6D9;padding:20px;
}
.login-card{
  width:100%;max-width:380px;background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;
  animation:fadeScale .35s var(--ease);
}
.login-banner{width:100%;display:block;object-fit:cover;max-height:220px;}
.login-body{padding:26px 26px 30px;}
.login-body h1{
  font-family:var(--font-display);font-weight:800;font-size:21px;margin:0 0 4px;
  color:var(--text);letter-spacing:-0.3px;text-align:center;
}
.login-body p.sub{color:var(--text-dim);font-size:13px;margin:0 0 22px;font-weight:500;text-align:center;}
.login-body .field{margin-bottom:14px;}
.login-body label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-faint);font-weight:700;display:block;margin-bottom:6px;}
.login-body input{
  background:var(--surface-2);border:1.5px solid transparent;color:var(--text);
  padding:13px 14px;border-radius:var(--radius-sm);font-size:15px;font-family:var(--font-body);
  width:100%;transition:border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
}
.login-body input:focus{
  outline:none;border-color:var(--accent);background:#fff;
  box-shadow:0 0 0 4px rgba(229,57,53,0.10);
}
.login-body .btn{width:100%;padding:13px 16px;margin-top:4px;font-size:14.5px;}
.login-error{
  color:var(--danger);background:var(--danger-bg);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;text-align:center;
  display:none;
}

// ============ Modal personalizado (reemplaza confirm()/prompt() nativos) ============
function openModal({title, message, danger=false, input=false, inputValue='', inputType='number', fields=null, confirmText, cancelText='Cancelar'}){
  return new Promise(resolve=>{
    const root = document.getElementById('modalRoot');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const fieldsHtml = fields ? `<div class="modal-fields">${fields.map(f=>`
        <div class="field">
          <label>${f.label}</label>
          <input type="${f.type||'number'}" ${f.type!=='text' ? 'step="any"' : ''} class="modal-input" data-field="${f.id}" value="${f.value ?? ''}" placeholder="${f.placeholder||''}">
        </div>`).join('')}</div>` : '';
    overlay.innerHTML = `
      <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-icon ${danger ? 'danger' : ''}">${danger ? '⚠️' : (input || fields ? '✏️' : '❓')}</div>
        <h3 class="modal-title">${title}</h3>
        ${message ? `<p class="modal-message">${message}</p>` : ''}
        ${input ? `<input type="${inputType}" ${inputType==='number' ? 'step="any"' : ''} class="modal-input" id="modalInputField" value="${inputValue}">` : ''}
        ${fieldsHtml}
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-act="cancel">${cancelText}</button>
          <button type="button" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" data-act="confirm">${confirmText || (input ? 'Aceptar' : 'Sí, continuar')}</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    requestAnimationFrame(()=> overlay.classList.add('show'));

    const fieldEl = overlay.querySelector('#modalInputField');
    const firstFocusable = fieldEl || overlay.querySelector('[data-field]');
    if(firstFocusable){ setTimeout(()=>{ firstFocusable.focus(); firstFocusable.select(); }, 250); }

    let done = false;
    function close(result){
      if(done) return;
      done = true;
      document.removeEventListener('keydown', onKey);
      overlay.classList.remove('show');
      overlay.classList.add('hide');
      setTimeout(()=> overlay.remove(), 200);
      resolve(result);
    }
    function onConfirm(){
      if(fields){
        const result = {};
        overlay.querySelectorAll('[data-field]').forEach(el=>{ result[el.dataset.field] = el.value; });
        close(result);
      } else if(input){
        close(fieldEl ? fieldEl.value : true);
      } else {
        close(true);
      }
    }
    function onCancel(){ close((input || fields) ? null : false); }
    function onKey(e){
      if(e.key === 'Escape') onCancel();
      if(e.key === 'Enter' && (!input || document.activeElement === fieldEl)) onConfirm();
    }
    overlay.querySelector('[data-act="confirm"]').addEventListener('click', onConfirm);
    overlay.querySelector('[data-act="cancel"]').addEventListener('click', onCancel);
    overlay.addEventListener('mousedown', e=>{ if(e.target === overlay) onCancel(); });
    document.addEventListener('keydown', onKey);
  });
}

function customConfirm(message, opts={}){
  return openModal({
    title: opts.title || '¿Confirmar acción?',
    message,
    danger: opts.danger !== false,
    input: false,
    confirmText: opts.confirmText,
    cancelText: opts.cancelText
  });
}

function customPrompt({title, message, value=''}){
  return openModal({
    title, message, input: true, inputValue: value, danger: false, confirmText: 'Aceptar'
  });
}

function openPriceModal(prod){
  const fields = [
    {id:'precioCompra', label:'Precio compra (unidad)', value: prod.precioCompra || 0},
    {id:'precioVenta', label:'Precio venta (unidad)', value: prod.precioVenta || 0},
  ];
  if(prod.tipo === 'Caja'){
    fields.push({id:'precioVentaCaja', label:'Precio venta (caja)', value: prod.precioVentaCaja ?? '', placeholder:'opcional'});
    fields.push({id:'precioVentaCava', label:'Precio venta (CAVA)', value: prod.precioVentaCava ?? '', placeholder:'opcional'});
  }
  return openModal({
    title: `Editar precios`,
    message: `"${prod.nombre}" · actualiza los valores que hayan cambiado.`,
    fields,
    confirmText: 'Guardar cambios'
  });
}

let unsubscribers = [];

function updateSyncBadge(status){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(status === 'ok'){ el.textContent = '🟢 Sincronizado'; }
  else if(status === 'offline'){ el.textContent = '🟡 Sin conexión (guardando local)'; }
  else if(status === 'error'){ el.textContent = '🔴 Error de sincronización'; }
}

async function loadData(){
  DATA = {products: [], purchases: [], sales: [], expenses: []};
  const keys = Object.keys(COLLECTIONS);
  const loadedOnce = {};
  let resolved = false;
  let resolveReady;
  const ready = new Promise(res => { resolveReady = res; });

  // Si en 15 segundos no logra conectar, avisa y sigue con datos locales
  // en vez de dejar la app colgada en "Conectando..." para siempre
  const timeoutId = setTimeout(() => {
    if(!resolved){
      console.warn('Timeout esperando a Firestore, usando datos locales');
      updateSyncBadge('error');
      showToast('⚠️ No se pudo conectar a la nube, usando datos locales');
      keys.forEach(k => { if(!loadedOnce[k]) DATA[k] = window.__SEED__[k] || []; });
      resolved = true;
      resolveReady();
    }
  }, 15000);

  function checkAllLoaded(){
    if(resolved) return;
    if(keys.every(k => loadedOnce[k])){
      resolved = true;
      clearTimeout(timeoutId);
      resolveReady();
    }
  }

  keys.forEach(key => {
    const unsub = COLLECTIONS[key].onSnapshot((snap) => {
      updateSyncBadge('ok');
      DATA[key] = snap.docs.map(d => d.data());
      if(!loadedOnce[key]){
        loadedOnce[key] = true;
        checkAllLoaded();
      } else if(resolved){
        // Cambio confirmado que vino de otro dispositivo
        renderAll();
      }
    }, (error) => {
      console.error(`Error de sincronización (${key})`, error);
      updateSyncBadge('error');
      if(!loadedOnce[key]){
        loadedOnce[key] = true;
        DATA[key] = window.__SEED__[key] || [];
        checkAllLoaded();
      }
    });
    unsubscribers.push(unsub);
  });

  await ready;

  // Si la nube está totalmente vacía (primera vez que se usa la app en este
  // proyecto de Firebase), la sembramos con los datos reales del Excel.
  if(!DATA.products.length && !DATA.purchases.length && !DATA.sales.length){
    await seedInitialData();
  }
}

async function seedInitialData(){
  try{
    const batch = db.batch();
    (window.__SEED__.products || []).forEach(p => batch.set(COLLECTIONS.products.doc(p.id), p));
    (window.__SEED__.purchases || []).forEach(p => batch.set(COLLECTIONS.purchases.doc(p.id), p));
    (window.__SEED__.sales || []).forEach(s => batch.set(COLLECTIONS.sales.doc(s.id), s));
    (window.__SEED__.expenses || []).forEach(g => batch.set(COLLECTIONS.expenses.doc(g.id), g));
    await batch.commit();
  }catch(e){
    console.error('No se pudo sembrar datos iniciales', e);
    updateSyncBadge('error');
  }
}

// Guarda (crea o actualiza) UN SOLO documento en su colección.
async function saveRecord(collectionKey, record){
  try{
    await COLLECTIONS[collectionKey].doc(record.id).set(record);
  }catch(e){
    console.error('Error guardando', e);
    updateSyncBadge('offline');
    showToast('⚠️ Sin conexión: se guardará cuando vuelva internet');
  }
}

// Elimina UN SOLO documento de su colección.
async function deleteRecord(collectionKey, id){
  try{
    await COLLECTIONS[collectionKey].doc(id).delete();
  }catch(e){
    console.error('Error eliminando', e);
    updateSyncBadge('offline');
    showToast('⚠️ Sin conexión: se eliminará cuando vuelva internet');
  }
}

// Reemplaza TODO lo que hay en la nube por un DATA nuevo completo (usado solo
// al importar un Excel corregido). Borra y reescribe cada colección por lotes.
async function replaceAllData(nuevaData){
  for(const key of Object.keys(COLLECTIONS)){
    const col = COLLECTIONS[key];
    const existingSnap = await col.get();
    const ops = [];
    existingSnap.docs.forEach(d => ops.push({type:'delete', ref: d.ref}));
    (nuevaData[key] || []).forEach(item => ops.push({type:'set', ref: col.doc(item.id), data:item}));
    for(let i=0; i<ops.length; i+=450){
      const batch = db.batch();
      ops.slice(i, i+450).forEach(op => {
        if(op.type === 'delete') batch.delete(op.ref);
        else batch.set(op.ref, op.data);
      });
      await batch.commit();
    }
  }
}

// ============ Cálculos de negocio ============
function getProduct(id){ return DATA.products.find(p => p.id === id); }

function unitsFromPurchase(pur, prod){
  if(!prod) return 0;
  if(pur.tipo === 'Caja') return (pur.cantidad || 0) * (prod.unidadesPorCaja || 1);
  return pur.cantidad || 0;
}
function costFromPurchase(pur, prod){
  if(!prod) return 0;
  // Usa el costo "congelado" guardado en el momento de la compra si existe.
  // Si es un registro antiguo sin ese dato, usa el precio de compra actual como respaldo.
  const unitCost = (pur.costoUnitario != null) ? pur.costoUnitario : (prod.precioCompra || 0);
  if(pur.tipo === 'Caja') return (pur.cantidad || 0) * (prod.unidadesPorCaja || 1) * unitCost;
  return (pur.cantidad || 0) * unitCost;
}
function unitsFromSale(sale, prod){
  if(!prod) return 0;
  if(sale.tipoVenta === 'Caja') return (sale.cantidad || 0) * (prod.unidadesPorCaja || 1);
  if(sale.tipoVenta === 'Cava') return (sale.cantidad || 0) * (prod.unidadesPorCava || 1);
  return sale.cantidad || 0;
}
function priceForSale(sale, prod){
  if(!prod) return 0;
  if(sale.tipoVenta === 'Caja') return prod.precioVentaCaja || 0;
  if(sale.tipoVenta === 'Cava') return prod.precioVentaCava || 0;
  return prod.precioVenta || 0;
}
function saleTotal(sale, prod){
  const price = priceForSale(sale, prod);
  // Las ventas nuevas (con descuentoTotal:true) restan el descuento del TOTAL.
  // Las ventas antiguas, ya guardadas antes de este cambio, conservan el
  // cálculo original: el descuento se restaba del precio por unidad.
  if(sale.descuentoTotal){
    return (sale.cantidad || 0) * price - (sale.descuento || 0);
  }
  return (sale.cantidad || 0) * (price - (sale.descuento || 0));
}
function saleProfit(sale, prod){
  if(!prod) return 0;
  const total = saleTotal(sale, prod);
  const units = unitsFromSale(sale, prod);
  // Usa el costo "congelado" guardado en el momento de la venta si existe.
  // Si es un registro antiguo sin ese dato, usa el precio de compra actual como respaldo.
  const unitCost = (sale.costoUnitario != null) ? sale.costoUnitario : (prod.precioCompra || 0);
  return total - (units * unitCost);
}

function lowStockThreshold(prod){
  return (prod && prod.stockMinimo != null && !isNaN(prod.stockMinimo)) ? prod.stockMinimo : 3;
}

function currentStock(productId){
  const prod = getProduct(productId);
  if(!prod) return 0;
  let stock = prod.stockInicial || 0;
  DATA.purchases.forEach(p => { if(p.productoId === productId) stock += unitsFromPurchase(p, prod); });
  DATA.sales.forEach(s => { if(s.productoId === productId) stock -= unitsFromSale(s, prod); });
  return stock;
}

function productInventoryValue(prod){
  return currentStock(prod.id) * (prod.precioCompra || 0);
}
function productPotentialProfit(prod){
  return (prod.precioVenta - prod.precioCompra) * currentStock(prod.id);
}

function getRole(){

  return localStorage.getItem(ROLE_STORAGE_KEY) || 'admin';

  return localStorage.getItem(LOGIN_STORAGE_KEY) === '1';

// Muestra u oculta pestañas y botones según el rol actual.
function applyRoleVisibility(role){
  const tabs = Array.from(document.querySelectorAll('.tab'));
  tabs.forEach(t=>{
    const roles = (t.dataset.roles || 'admin,vendedor').split(',');
    t.style.display = roles.includes(role) ? '' : 'none';
  });
  const restoreBtn = document.getElementById('restoreBtn');
  if(restoreBtn) restoreBtn.style.display = role === 'admin' ? '' : 'none';

  // Si la pestaña activa no está permitida para este rol, saltar a la primera que sí lo esté.
  const allowedTabs = tabs.filter(t => t.style.display !== 'none').map(t => t.dataset.tab);
  if(!allowedTabs.includes(ACTIVE_TAB)){
    ACTIVE_TAB = allowedTabs[0] || 'ventas';
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === ACTIVE_TAB));
  }
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  applyRoleVisibility(getRole());
}

function showLogin(){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const pwField = document.getElementById('loginPassword');
  if(pwField){ pwField.value = ''; setTimeout(()=>pwField.focus(), 200); }

function setupLogin(){
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const val = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    let role = null;
    if(val === LOGIN_PASSWORD_ADMIN) role = 'admin';
    else if(val === LOGIN_PASSWORD_VENDEDOR) role = 'vendedor';
    if(role){
      localStorage.setItem(LOGIN_STORAGE_KEY, '1');
      localStorage.setItem(ROLE_STORAGE_KEY, role);
      errorEl.classList.remove('show');
      showApp();
      await ensureUserName();
      renderAll();
    } else {
      errorEl.classList.add('show');
    }
  });
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(LOGIN_STORAGE_KEY);
    localStorage.removeItem(ROLE_STORAGE_KEY);
    showLogin();
  });
  document.getElementById('userBadge').addEventListener('click', async () => {
    const nuevo = await customPrompt({
      title: 'Tu nombre',
      message: 'Este nombre queda registrado en cada compra, venta, gasto o producto que agregues o elimines.',

    try{

      showToast('⏳ Reemplazando datos en la nube…');
      await replaceAllData(nuevaData);

      renderAll();
      await logActividad('Importó Excel', `${DATA.products.length} productos, ${DATA.purchases.length} compras, ${DATA.sales.length} ventas`);
      showToast(`✅ Importado: ${DATA.products.length} productos, ${DATA.purchases.length} compras, ${DATA.sales.length} ventas`);

      console.error(err);
      alert('❌ No se pudo importar el Excel:\n\n' + err.message + '\n\nRevisa que el archivo tenga las hojas Inventario, Compras, Ventas y Gastos con las mismas columnas de siempre.');
    }
  });
}

// ============ IMPORTAR EXCEL (Inventario / Compras / Ventas / Gastos) ============
// Esta función lee cualquier Excel que siga el mismo formato de columnas que
// el archivo de trabajo del negocio (hojas: Inventario, Compras, Ventas, Gastos)
// y devuelve un objeto DATA completo, listo para reemplazar todo lo guardado.
function normCell(v){
  if(v === undefined) return null;
  if(typeof v === 'string') return v.trim();
  return v;
}
function excelDateToStr(v){
  if(v === null || v === undefined || v === '') return '';
  if(v instanceof Date){
    const y = v.getUTCFullYear(), m = String(v.getUTCMonth()+1).padStart(2,'0'), d = String(v.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  // Si ya viene como YYYY-MM-DD o similar, la dejamos tal cual
  return s;
}
function findHeaderRow(rows, mustStartWith){
  // Busca la primera fila cuya primera celda (en minúsculas) coincida con mustStartWith
  for(let i=0;i<rows.length;i++){
    const cell = normCell(rows[i][0]);
    if(typeof cell === 'string' && cell.toLowerCase() === mustStartWith.toLowerCase()){
      return i;
    }
  }
  return -1;
}

async function parseExcelToData(file){
  if(typeof XLSX === 'undefined'){
    throw new Error('No se pudo cargar el motor de Excel (sin conexión a internet).');
  }
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, {type:'array', cellDates:true});

  const findSheet = (name) => {
    const key = Object.keys(wb.Sheets).find(k => k.toLowerCase() === name.toLowerCase());
    return key ? wb.Sheets[key] : null;
  };

  const wsInv = findSheet('Inventario');
  const wsCompras = findSheet('Compras');
  const wsVentas = findSheet('Ventas');
  const wsGastos = findSheet('Gastos');

  if(!wsInv) throw new Error('No encontré la hoja "Inventario" en el Excel.');
  if(!wsCompras) throw new Error('No encontré la hoja "Compras" en el Excel.');
  if(!wsVentas) throw new Error('No encontré la hoja "Ventas" en el Excel.');

  // ---------- Productos (Inventario) ----------
  const invRows = XLSX.utils.sheet_to_json(wsInv, {header:1, defval:null, raw:true});
  const invHeaderIdx = findHeaderRow(invRows, 'Producto');
  if(invHeaderIdx === -1) throw new Error('No encontré la fila de encabezados ("Producto") en la hoja Inventario.');

  const products = [];
  const nameToEntries = {}; // nombre en mayúsculas -> [{id, categoria}]
  let currentCat = 'GENERAL';
  let pCounter = 1;
  const dupWarnings = [];

  for(let i = invHeaderIdx + 1; i < invRows.length; i++){
    const r = invRows[i];
    const nombre = normCell(r[0]);
    if(nombre === null || nombre === '') continue;

    const cantidad = normCell(r[1]);
    const precioCompra = normCell(r[2]);
    const precioVenta = normCell(r[3]);
    const stockInicial = normCell(r[6]);
    const tipo = normCell(r[9]);
    const unidadesPorCaja = normCell(r[10]);
    const precioVentaCaja = normCell(r[15]);
    const unidadesPorCava = normCell(r[17]);
    const precioVentaCava = normCell(r[18]);

    const esFilaCategoria = (cantidad===null && precioCompra===null && stockInicial===null && tipo===null);
    if(esFilaCategoria){
      currentCat = nombre;
      continue;
    }

    const id = 'p' + (pCounter++);
    products.push({
      id,
      categoria: currentCat,
      nombre,
      precioCompra: (typeof precioCompra === 'number') ? precioCompra : 0,
      precioVenta: (typeof precioVenta === 'number') ? precioVenta : 0,
      tipo: (tipo === 'Caja' || tipo === 'Unidad') ? tipo : 'Unidad',
      unidadesPorCaja: (typeof unidadesPorCaja === 'number' && unidadesPorCaja) ? Math.round(unidadesPorCaja) : null,
      precioVentaCaja: (typeof precioVentaCaja === 'number' && precioVentaCaja) ? precioVentaCaja : null,
      unidadesPorCava: (typeof unidadesPorCava === 'number' && unidadesPorCava) ? Math.round(unidadesPorCava) : null,
      precioVentaCava: (typeof precioVentaCava === 'number' && precioVentaCava) ? precioVentaCava : null,
      stockMinimo: 3,
      stockInicial: (typeof stockInicial === 'number') ? stockInicial : 0,
    });

    const key = nombre.toUpperCase();
    if(!nameToEntries[key]) nameToEntries[key] = [];
    nameToEntries[key].push(id);
  }

  Object.keys(nameToEntries).forEach(key=>{
    if(nameToEntries[key].length > 1) dupWarnings.push(key);
  });

  const productById = {};
  products.forEach(p=>{ productById[p.id] = p; });

  // Resuelve un nombre a un id de producto (si hay nombres repetidos, usa el primero
  // y lo deja anotado en dupWarnings para que el usuario lo revise).
  function resolveProductId(nombre){
    const key = String(nombre).trim().toUpperCase();
    const ids = nameToEntries[key];
    if(!ids || ids.length === 0) return null;
    return ids[0];
  }

  // ---------- Compras ----------
  const comprasRows = XLSX.utils.sheet_to_json(wsCompras, {header:1, defval:null, raw:true});
  const comprasHeaderIdx = findHeaderRow(comprasRows, 'Fecha');
  if(comprasHeaderIdx === -1) throw new Error('No encontré la fila de encabezados ("Fecha") en la hoja Compras.');

  const purchases = [];
  let cCounter = 1;
  const missingNames = new Set();
  for(let i = comprasHeaderIdx + 1; i < comprasRows.length; i++){
    const r = comprasRows[i];
    const nombre = normCell(r[1]);
    if(nombre === null || nombre === '') continue;
    const pid = resolveProductId(nombre);
    if(!pid){ missingNames.add(nombre); continue; }
    const prod = productById[pid];

    const cantidad = normCell(r[2]);
    const tipoRaw = normCell(r[4]);
    const cantidadCajas = normCell(r[6]);
    const tipoFinal = (tipoRaw === 'Caja' || tipoRaw === 'Unidad') ? tipoRaw : 'Unidad';
    const cantFinal = tipoFinal === 'Caja'
      ? (typeof cantidadCajas === 'number' ? cantidadCajas : 0)
      : (typeof cantidad === 'number' ? cantidad : 0);

    purchases.push({
      id: 'c' + (cCounter++),
      fecha: excelDateToStr(r[0]),
      productoId: pid,
      tipo: tipoFinal,
      cantidad: cantFinal,
      costoUnitario: prod.precioCompra,
    });
  }

  // ---------- Ventas ----------
  const ventasRows = XLSX.utils.sheet_to_json(wsVentas, {header:1, defval:null, raw:true});
  const ventasHeaderIdx = findHeaderRow(ventasRows, 'Fecha');
  if(ventasHeaderIdx === -1) throw new Error('No encontré la fila de encabezados ("Fecha") en la hoja Ventas.');

  const sales = [];
  let vCounter = 1;
  for(let i = ventasHeaderIdx + 1; i < ventasRows.length; i++){
    const r = ventasRows[i];
    const nombre = normCell(r[1]);
    if(nombre === null || nombre === '') continue;
    const pid = resolveProductId(nombre);
    if(!pid){ missingNames.add(nombre); continue; }
    const prod = productById[pid];

    const cantidadVendida = normCell(r[2]);
    if(cantidadVendida === null) continue;
    const descuento = normCell(r[6]);
    const tipoVentaRaw = normCell(r[7]);
    const tipoVentaFinal = (tipoVentaRaw === 'Caja' || tipoVentaRaw === 'Unidad' || tipoVentaRaw === 'Cava') ? tipoVentaRaw : 'Unidad';

    sales.push({
      id: 'v' + (vCounter++),
      fecha: excelDateToStr(r[0]),
      productoId: pid,
      cantidad: cantidadVendida,
      tipoVenta: tipoVentaFinal,
      descuento: (typeof descuento === 'number') ? descuento : 0,
      costoUnitario: prod.precioCompra,
    });
  }

  // ---------- Gastos ----------
  const expenses = [];
  if(wsGastos){
    const gastosRows = XLSX.utils.sheet_to_json(wsGastos, {header:1, defval:null, raw:true});
    const gastosHeaderIdx = findHeaderRow(gastosRows, 'Fecha');
    let gCounter = 1;
    if(gastosHeaderIdx !== -1){
      for(let i = gastosHeaderIdx + 1; i < gastosRows.length; i++){
        const r = gastosRows[i];
        const valor = normCell(r[2]);
        const descripcion = normCell(r[1]);
        const fecha = normCell(r[0]);
        if(fecha === null && descripcion === null) continue;
        if(typeof valor !== 'number' || valor === 0) continue;
        expenses.push({
          id: 'g' + (gCounter++),
          fecha: excelDateToStr(fecha),
          descripcion: descripcion || '',
          valor,
        });
      }
    }
  }

  if(missingNames.size > 0){
    console.warn('Productos mencionados en Compras/Ventas que no existen en Inventario:', [...missingNames]);
  }
  if(dupWarnings.length > 0){
    console.warn('Nombres de producto repetidos en Inventario (se usó el primero para cada venta/compra):', dupWarnings);
  }

  if(missingNames.size > 0 || dupWarnings.length > 0){
    let msg = '';
    if(missingNames.size > 0){
      msg += `⚠️ Estos productos aparecen en Compras/Ventas pero no están en Inventario, así que se ignoraron sus filas:\n${[...missingNames].join(', ')}\n\n`;
    }
    if(dupWarnings.length > 0){
      msg += `⚠️ Estos nombres de producto están repetidos en Inventario (categorías distintas). Se asignaron todas sus compras/ventas al primero que aparece en la hoja — revísalos manualmente si hace falta:\n${dupWarnings.join(', ')}`;
    }
    alert(msg.trim());
  }

  return { products, purchases, sales, expenses };
}

function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('⚠️ No se pudo cargar el motor de Excel, revisa tu conexión');
    return;
  }

  const wb = XLSX.utils.book_new();
  const generadoEl = 'Exportado desde La Central el ' + new Date().toLocaleString('es-CO');

  // ---------- Inventario ----------
  const invRows = [
    ['📦 Inventario'],
    [generadoEl],
    [],
    ['Producto','Cantidad','Precio de compra','Precio de venta','Valor del inventario','Ganancia potencial','Stock inicial','Compras','Ventas','Tipo (Caja/Unidad)','Unidades por caja','Precio venta (caja)','Unidades por CAVA','Precio de venta (CAVA)']
  ];
  const categorias = [];
  DATA.products.forEach(p=>{ if(!categorias.includes(p.categoria)) categorias.push(p.categoria); });
  categorias.forEach(cat=>{
    invRows.push([cat]);
    DATA.products.filter(p=>p.categoria===cat).forEach(p=>{
      let compras = 0, ventas = 0;
      DATA.purchases.forEach(pu=>{ if(pu.productoId===p.id) compras += unitsFromPurchase(pu,p); });
      DATA.sales.forEach(s=>{ if(s.productoId===p.id) ventas += unitsFromSale(s,p); });
      invRows.push([
        p.nombre, currentStock(p.id), p.precioCompra||0, p.precioVenta||0,
        productInventoryValue(p), productPotentialProfit(p),
        p.stockInicial||0, compras, ventas, p.tipo,
        p.unidadesPorCaja||'', p.precioVentaCaja||'', p.unidadesPorCava||'', p.precioVentaCava||''
      ]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(invRows), 'Inventario');

  // ---------- Compras ----------
  const comprasRows = [
    ['🛒 Compras'], [generadoEl], [],
    ['Fecha','Producto','Cantidad','Tipo','Unidades por caja','Precio de compra (unidad)','Costo total']
  ];
  DATA.purchases.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).forEach(pu=>{
    const p = getProduct(pu.productoId);
    comprasRows.push([
      pu.fecha||'(sin fecha)', p?p.nombre:pu.productoId, pu.cantidad, pu.tipo,
      p?(p.unidadesPorCaja||''):'', p?(p.precioCompra||0):0, costFromPurchase(pu,p)
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(comprasRows), 'Compras');

  // ---------- Ventas ----------
  const ventasRows = [
    ['💰 Ventas'], [generadoEl], [],
    ['Fecha','Producto','Cantidad vendida','Tipo de venta','Precio unitario','Descuento','Total vendido','Ganancia']
  ];
  DATA.sales.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).forEach(s=>{
    const p = getProduct(s.productoId);
    ventasRows.push([
      s.fecha||'', p?p.nombre:s.productoId, s.cantidad, s.tipoVenta,
      priceForSale(s,p), s.descuento||0, saleTotal(s,p), saleProfit(s,p)
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ventasRows), 'Ventas');

  // ---------- Gastos ----------
  const gastosRows = [
    ['💸 Gastos'], [generadoEl], [],
    ['Fecha','Descripción','Valor']
  ];
  DATA.expenses.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).forEach(g=>{
    gastosRows.push([g.fecha||'', g.descripcion||'', g.valor||0]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gastosRows), 'Gastos');

  // ---------- Resumen ----------
  const totalInvertido = DATA.purchases.reduce((sum,p)=> sum + costFromPurchase(p, getProduct(p.productoId)), 0);
  const valorInventario = DATA.products.reduce((sum,p)=> sum + productInventoryValue(p), 0);
  const totalVendido = DATA.sales.reduce((sum,s)=> sum + saleTotal(s, getProduct(s.productoId)), 0);
  const totalGastos = DATA.expenses.reduce((sum,g)=> sum + (g.valor||0), 0);
  const gananciaTotal = DATA.sales.reduce((sum,s)=> sum + saleProfit(s, getProduct(s.productoId)), 0) - totalGastos;

  const resumenRows = [
    ['📊 Resumen del negocio'],
    [generadoEl],
    [],
    ['Dinero invertido en inventario (total comprado)', totalInvertido],
    ['Valor actual del inventario (al costo)', valorInventario],
    ['Total vendido (acumulado)', totalVendido],
    ['Total de gastos (acumulado)', totalGastos],
    ['Ganancia neta acumulada (ventas − costo − gastos)', gananciaTotal]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumenRows), 'Resumen');

  const filename = 'LaCentral_' + todayStr() + '.xlsx';
  XLSX.writeFile(wb, filename);
  showToast('📥 Excel exportado: ' + filename);
}

function catHue(name){
  let hash = 0;
  const str = String(name || '');
  for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash << 5) - hash); }
  return Math.abs(hash) % 360;
}

function renderInvBody(){
  const tbody = document.getElementById('invBody');
  if(!tbody) return;
  const q = invSearch.trim().toLowerCase();
  const filtered = DATA.products.filter(p => !q || p.nombre.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q));

  if(!filtered.length){
    tbody.innerHTML = `<tr><td colspan="8" class="empty">No hay productos que coincidan.</td></tr>`;
    return;
  }

  // agrupar por categoría manteniendo orden
  const groups = [];
  const seen = new Map();
  filtered.forEach(p=>{
    if(!seen.has(p.categoria)){ seen.set(p.categoria, []); groups.push(p.categoria); }
    seen.get(p.categoria).push(p);
  });

  let html = '';
  groups.forEach(cat=>{
    const hue = catHue(cat);
    html += `<tr class="cat-row" style="--cat-h:${hue}"><td colspan="8">${cat}</td></tr>`;
    seen.get(cat).forEach(p=>{
      const stock = currentStock(p.id);
      const threshold = lowStockThreshold(p);
      const low = stock < threshold;
      const gaugePct = Math.max(0, Math.min(100, (stock / 20) * 100));
      const gaugeColor = low ? 'var(--danger)' : (stock < threshold * 2.5 ? 'var(--accent)' : 'var(--success)');
      html += `<tr data-id="${p.id}" style="--cat-h:${hue}">
        <td data-label="Producto" title="${p.creadoPor ? 'Agregado por ' + p.creadoPor : ''}">${p.nombre}</td>
        <td class="right" data-label="Stock">
          <div class="gauge-wrap" style="justify-content:flex-end;">
            <span class="num">${fmtNum(stock)}</span>
            <div class="gauge"><div class="gauge-fill" style="width:${gaugePct}%;background:${gaugeColor};"></div></div>
            ${low ? `<span class="badge badge-low" title="Alerta configurada en menos de ${fmtNum(threshold)}">bajo</span>` : ''}
          </div>
        </td>
        <td class="right num labeled" data-label="P. compra"><span class="cell-label">P. compra</span><span class="cell-value">${fmt(p.precioCompra)}</span></td>
        <td class="right num labeled" data-label="P. venta"><span class="cell-label">P. venta</span><span class="cell-value">${fmt(p.precioVenta)}</span></td>
        <td class="right num labeled" data-label="Valor inv."><span class="cell-label">Valor inv.</span><span class="cell-value">${fmt(productInventoryValue(p))}</span></td>
        <td class="right num labeled" data-label="Ganancia pot."><span class="cell-label">Ganancia pot.</span><span class="cell-value">${fmt(productPotentialProfit(p))}</span></td>
        <td data-label="Tipo"><span class="muted">${p.tipo}</span></td>
        <td style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm" data-price="${p.id}">Editar precios</button>
          <button class="btn btn-sm" data-adjust="${p.id}">Ajustar stock</button>
          <button class="btn btn-sm" data-umbral="${p.id}">Umbral (${fmtNum(threshold)})</button>
          <button class="btn btn-danger" data-del="${p.id}">Eliminar</button>
        </td>
      </tr>`;
    });
  });
  tbody.innerHTML = html;

  tbody.querySelectorAll('[data-price]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.price;
      const prod = getProduct(id);
      if(!prod) return;
      const result = await openPriceModal(prod);
      if(!result) return;

      const nuevoCompra = parseFloat(result.precioCompra);
      const nuevoVenta = parseFloat(result.precioVenta);
      if(isNaN(nuevoCompra) || nuevoCompra < 0 || isNaN(nuevoVenta) || nuevoVenta < 0){
        showToast('⚠️ Valores no válidos, no se cambió nada');
        return;
      }
      prod.precioCompra = nuevoCompra;
      prod.precioVenta = nuevoVenta;
      if(prod.tipo === 'Caja'){
        const caja = parseFloat(result.precioVentaCaja);
        const cava = parseFloat(result.precioVentaCava);
        prod.precioVentaCaja = (result.precioVentaCaja !== '' && !isNaN(caja) && caja >= 0) ? caja : null;
        prod.precioVentaCava = (result.precioVentaCava !== '' && !isNaN(cava) && cava >= 0) ? cava : null;
      }
      await saveRecord('products', prod);
      await logActividad('Editó precios', prod.nombre);
      showToast(`✅ Precios de "${prod.nombre}" actualizados`);
      renderInvBody();
    });
  });

  tbody.querySelectorAll('[data-adjust]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.adjust;
      const prod = getProduct(id);
      if(!prod) return;
      const stockActual = currentStock(id);
      const respuesta = await customPrompt({
        title: `Ajustar stock de "${prod.nombre}"`,
        message: `Stock actual calculado: ${fmtNum(stockActual)}   ·   Stock inicial guardado: ${fmtNum(prod.stockInicial||0)}\n\nEscribe el stock inicial correcto (el que tenía ANTES de registrar compras/ventas en la app):`,
        value: prod.stockInicial || 0
      });
      if(respuesta === null) return;
      const nuevoValor = parseFloat(respuesta);
      if(isNaN(nuevoValor) || nuevoValor < 0){
        showToast('⚠️ Valor no válido, no se cambió nada');
        return;
      }
      prod.stockInicial = nuevoValor;
      await saveRecord('products', prod);
      await logActividad('Ajustó stock', `${prod.nombre} → ${fmtNum(nuevoValor)}`);
      showToast(`✅ Stock inicial de "${prod.nombre}" actualizado`);
      renderInvBody();
    });
  });

  tbody.querySelectorAll('[data-umbral]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.umbral;
      const prod = getProduct(id);
      if(!prod) return;
      const respuesta = await customPrompt({
        title: `Umbral de "${prod.nombre}"`,
        message: `Se mostrará "poco stock" cuando la cantidad sea MENOR a este número.\n\nProductos que rotan rápido (ej: cervezas) deberían tener un umbral más alto que los que rotan lento.`,
        value: lowStockThreshold(prod)
      });
      if(respuesta === null) return;
      const nuevoValor = parseFloat(respuesta);
      if(isNaN(nuevoValor) || nuevoValor < 0){
        showToast('⚠️ Valor no válido, no se cambió nada');
        return;
      }
      prod.stockMinimo = nuevoValor;
      await saveRecord('products', prod);
      await logActividad('Cambió umbral', `${prod.nombre} → ${fmtNum(nuevoValor)}`);
      showToast(`✅ Umbral de "${prod.nombre}" actualizado a ${fmtNum(nuevoValor)}`);
      renderInvBody();
    });
  });

  tbody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.del;
      const prod = getProduct(id);
      const ok = await customConfirm(`Esto no borra las compras/ventas ya registradas de "${prod.nombre}".`, {title:`¿Eliminar "${prod.nombre}"?`, confirmText:'Sí, eliminar'});
      if(!ok) return;
      DATA.products = DATA.products.filter(p=>p.id!==id);
      await deleteRecord('products', id);
      await logActividad('Eliminó producto', prod ? prod.nombre : id);
      showToast('Producto eliminado');
      renderInvBody();
    });
  });
}

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Producto</th><th class="right">Cantidad</th>
          </tr></thead>
          <tbody id="stockBody"></tbody>
        </table>
      </div>
    </div>
  `;

  renderStockBody();

  document.getElementById('stockSearchInput').addEventListener('input', e => {
    stockSearch = e.target.value;
    renderStockBody();
  });
}

function renderStockBody(){
  const tbody = document.getElementById('stockBody');
  if(!tbody) return;
  const q = stockSearch.trim().toLowerCase();
  const filtered = DATA.products.filter(p => !q || p.nombre.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q));

  if(!filtered.length){
    tbody.innerHTML = `<tr><td colspan="2" class="empty">No hay productos que coincidan.</td></tr>`;
    return;
  }

  // agrupar por categoría manteniendo orden, igual que en Inventario
  const groups = [];
  const seen = new Map();
  filtered.forEach(p=>{
    if(!seen.has(p.categoria)){ seen.set(p.categoria, []); groups.push(p.categoria); }
    seen.get(p.categoria).push(p);
  });

  let html = '';
  groups.forEach(cat=>{
    const hue = catHue(cat);
    html += `<tr class="cat-row" style="--cat-h:${hue}"><td colspan="2">${cat}</td></tr>`;
    seen.get(cat).forEach(p=>{
      const stock = currentStock(p.id);
      html += `<tr data-id="${p.id}" style="--cat-h:${hue}">
        <td data-label="Producto">${p.nombre}</td>
        <td class="right num" data-label="Cantidad">${fmtNum(stock)}</td>
      </tr>`;
    });
  });
  tbody.innerHTML = html;
}

// ============ COMPRAS ============
function productOptions(selectedId){
  const cats = [...new Set(DATA.products.map(p=>p.categoria))];
  return cats.map(cat=>{
    const opts = DATA.products.filter(p=>p.categoria===cat)
      .map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.nombre}</option>`).join('');
    return `<optgroup label="${cat}">${opts}</optgroup>`;
  }).join('');
}

function renderCompras(root){
  root.innerHTML = `
    <div class="card">
      <h2>Registrar compra</h2>
      <p class="sub">Cada compra suma automáticamente al inventario.</p>
      <form id="formCompra" class="form-grid">
        <div class="field">
          <label>Fecha</label>
          <input name="fecha" type="date" value="${todayStr()}" required>
        </div>
        <div class="field" style="grid-column:span 2;">
          <label>Producto</label>
          <select name="productoId" required>${productOptions()}</select>
        </div>
        <div class="field">
          <label>Tipo</label>
          <select name="tipo">
            <option value="Unidad">Unidad</option>
            <option value="Caja">Caja</option>
          </select>
        </div>
        <div class="field">
          <label>Cantidad</label>
          <input name="cantidad" type="number" step="any" placeholder="0" required>
        </div>
        <div class="field">
          <button class="btn btn-primary" type="submit">+ Registrar compra</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">Historial de compras <span class="muted" style="font-weight:400;font-size:13px;">(${DATA.purchases.length})</span></h2>
        <input class="search" id="compSearchInput" placeholder="Buscar producto..." value="${compraSearch}">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Fecha</th><th>Producto</th><th>Tipo</th><th class="right">Cantidad</th>
            <th class="right">Unidades sumadas</th><th class="right">Costo</th><th></th>
          </tr></thead>
          <tbody id="compBody"></tbody>
        </table>
      </div>
    </div>

  renderCompBody();

  document.getElementById('compSearchInput').addEventListener('input', e => {

  });

  document.getElementById('formCompra').addEventListener('submit', async e => {
    e.preventDefault();

    if(!cantidad || cantidad <= 0) return;
    const productoId = f.get('productoId');
    const prod = getProduct(productoId);
    const nuevaCompra = {
      id: uid('c'),
      fecha: f.get('fecha'),
      productoId,
      tipo: f.get('tipo'),
      cantidad,
      // Se "congela" el precio de compra de hoy para que si luego cambias el precio
      // del producto, esta compra ya registrada no cambie de costo retroactivamente.
      costoUnitario: prod ? (prod.precioCompra || 0) : 0,
      registradoPor: getCurrentUser() || 'Sin nombre',
    };
    DATA.purchases.push(nuevaCompra);
    await saveRecord('purchases', nuevaCompra);
    await logActividad('Registró compra', `${prod ? prod.nombre : productoId} × ${fmtNum(cantidad)}`);
    showToast('Compra registrada — inventario actualizado');

}

function renderCompBody(){
  const tbody = document.getElementById('compBody');
  if(!tbody) return;
  const q = compraSearch.trim().toLowerCase();
  const source = DATA.purchases.filter(p => {
    if(!q) return true;
    const prod = getProduct(p.productoId);
    return prod && (prod.nombre.toLowerCase().includes(q) || prod.categoria.toLowerCase().includes(q));
  });
  if(!source.length){
    tbody.innerHTML = `<tr><td colspan="7" class="empty">${DATA.purchases.length ? 'No hay compras que coincidan.' : 'Aún no hay compras registradas.'}</td></tr>`;
    return;
  }
  const sorted = [...source].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  tbody.innerHTML = sorted.map(p=>{
    const prod = getProduct(p.productoId);
    const units = unitsFromPurchase(p, prod);
    const cost = costFromPurchase(p, prod);
    return `<tr data-id="${p.id}">
      <td class="num" data-label="Fecha">${p.fecha || '—'}${p.registradoPor?`<br><span class="muted" style="font-size:10px;">por ${p.registradoPor}</span>`:''}</td>
      <td data-label="Producto">${prod ? prod.nombre : '<span class="muted">(producto eliminado)</span>'}</td>
      <td data-label="Tipo"><span class="muted">${p.tipo}</span></td>
      <td class="right num" data-label="Cantidad">${fmtNum(p.cantidad)}</td>
      <td class="right num" data-label="Unidades">${fmtNum(units)}</td>
      <td class="right num" data-label="Costo">${fmt(cost)}</td>
      <td><button class="btn btn-danger" data-del="${p.id}">Eliminar</button></td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ok = await customConfirm('El inventario se recalculará automáticamente.', {title:'¿Eliminar esta compra?', confirmText:'Sí, eliminar'});
      if(!ok) return;
      const compra = DATA.purchases.find(p=>p.id===btn.dataset.del);
      DATA.purchases = DATA.purchases.filter(p=>p.id!==btn.dataset.del);
      await deleteRecord('purchases', btn.dataset.del);
      await logActividad('Eliminó compra', compra ? (getProduct(compra.productoId)||{}).nombre : '');
      showToast('Compra eliminada');
      renderCompBody();
    });
  });
}

// ============ VENTAS ============
function renderVentas(root){
  const isAdmin = getRole() === 'admin';
  const salesCount = DATA.sales.length;
  root.innerHTML = `
    <div class="card">
      <h2>Registrar venta</h2>
      <p class="sub">El precio, total y ganancia se calculan solos según el tipo de venta.</p>
      <form id="formVenta" class="form-grid">
        <div class="field">
          <label>Fecha</label>
          <input name="fecha" type="date" value="${todayStr()}" required>
        </div>
        <div class="field" style="grid-column:span 2;">
          <label>Producto</label>
          <select name="productoId" id="ventaProducto" required>${productOptions(null)}</select>
        </div>
        <div class="field">
          <label>Tipo de venta</label>
          <select name="tipoVenta" id="ventaTipo">
            <option value="Unidad">Unidad</option>
            <option value="Caja">Caja</option>
            <option value="Cava">Cava</option>
          </select>
        </div>
        <div class="field">
          <label>Cantidad</label>
          <input name="cantidad" type="number" step="any" placeholder="0" required>
        </div>
        <div class="field">
          <label>Descuento (total de la venta)</label>
          <input name="descuento" type="number" step="any" placeholder="0">
        </div>
        <div class="field">
          <button class="btn btn-primary" type="submit">+ Registrar venta</button>
        </div>
        <div class="field" style="grid-column:1/-1;">
          <span class="muted" id="ventaPreview" style="font-size:12.5px;"></span>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Historial de ventas <span class="muted" style="font-weight:400;font-size:13px;">(${salesCount})</span></h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Fecha</th><th>Producto</th><th>Tipo</th><th class="right">Cant.</th>
            <th class="right">Total vendido</th><th class="right">Ganancia</th>${isAdmin ? '<th></th>' : ''}
          </tr></thead>
          <tbody id="ventaBody"></tbody>
        </table>
      </div>
    </div>
  `;

  renderVentaBody();

    document.getElementById(id).addEventListener('change', updateVentaPreview);
  });
  document.querySelector('#formVenta [name="cantidad"]').addEventListener('input', updateVentaPreview);
  document.querySelector('#formVenta [name="descuento"]').addEventListener('input', updateVentaPreview);

  document.getElementById('formVenta').addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const cantidad = parseFloat(f.get('cantidad'));
    if(!cantidad || cantidad <= 0) return;
    const productoId = f.get('productoId');
    const prod = getProduct(productoId);
    const tipoVenta = f.get('tipoVenta');
    const stockDisponible = currentStock(productoId);
    const unidadesQueSalen = unitsFromSale({cantidad, tipoVenta}, prod);
    if(unidadesQueSalen > stockDisponible){
      const ok = await customConfirm(`Solo hay ${fmtNum(stockDisponible)} unidades de "${prod.nombre}" en inventario y esta venta necesita ${fmtNum(unidadesQueSalen)}.`, {title:'Stock insuficiente', confirmText:'Registrar de todas formas'});
      if(!ok) return;
    }
    const nuevaVenta = {
      id: uid('v'),
      fecha: f.get('fecha'),
      productoId,
      cantidad,
      tipoVenta,
      descuento: parseFloat(f.get('descuento')) || 0,
      descuentoTotal: true, // esta venta usa el descuento sobre el total, no por unidad
      // Se "congela" el precio de compra de hoy para que si luego cambias el precio
      // del producto, esta venta ya registrada no cambie de ganancia retroactivamente.
      costoUnitario: prod ? (prod.precioCompra || 0) : 0,
      registradoPor: getCurrentUser() || 'Sin nombre',
    };
    DATA.sales.push(nuevaVenta);
    await saveRecord('sales', nuevaVenta);
    await logActividad('Registró venta', `${prod ? prod.nombre : productoId} × ${fmtNum(cantidad)}`);
    showToast('Venta registrada');
    renderVentas(root);
  });
}

function updateVentaPreview(){
  const form = document.getElementById('formVenta');
  if(!form) return;
  const f = new FormData(form);
  const prod = getProduct(f.get('productoId'));
  const cantidad = parseFloat(f.get('cantidad')) || 0;
  const descuento = parseFloat(f.get('descuento')) || 0;
  const sale = {cantidad, tipoVenta:f.get('tipoVenta'), descuento, descuentoTotal:true};
  const el = document.getElementById('ventaPreview');
  if(!prod || !cantidad){ el.textContent = ''; return; }
  const total = saleTotal(sale, prod);
  const profit = saleProfit(sale, prod);
  const stock = currentStock(prod.id);
  el.innerHTML = `Total: <strong style="color:var(--accent-2)">${fmt(total)}</strong> · Ganancia: <strong style="color:${profit>=0?'var(--success)':'var(--danger)'}">${fmt(profit)}</strong> · Stock disponible: ${fmtNum(stock)}`;
}

  const tbody = document.getElementById('ventaBody');

  const isAdmin = getRole() === 'admin';
  const colspan = isAdmin ? 7 : 6;
  const source = DATA.sales;
  if(!source.length){
    tbody.innerHTML = `<tr><td colspan="${colspan}" class="empty">Aún no hay ventas registradas.</td></tr>`;
    return;
  }
  const sorted = [...source].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  tbody.innerHTML = sorted.map(s=>{
    const prod = getProduct(s.productoId);
    const total = saleTotal(s, prod);

      <td class="num" data-label="Fecha">${s.fecha || '—'}${s.registradoPor?`<br><span class="muted" style="font-size:10px;">por ${s.registradoPor}</span>`:''}</td>
      <td data-label="Producto">${prod ? prod.nombre : '<span class="muted">(producto eliminado)</span>'}</td>
      <td data-label="Tipo"><span class="muted">${s.tipoVenta}</span></td>
      <td class="right num" data-label="Cant.">${fmtNum(s.cantidad)}</td>
      <td class="right num" data-label="Total">${fmt(total)}</td>
      <td class="right num" data-label="Ganancia" style="color:${profit>=0?'var(--success)':'var(--danger)'}">${fmt(profit)}</td>
      ${extraCol}

  }).join('');

  tbody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ok = await customConfirm('El inventario se recalculará automáticamente.', {title:'¿Eliminar esta venta?', confirmText:'Sí, eliminar'});
      if(!ok) return;
      const venta = DATA.sales.find(s=>s.id===btn.dataset.del);
      DATA.sales = DATA.sales.filter(s=>s.id!==btn.dataset.del);
      await deleteRecord('sales', btn.dataset.del);
      await logActividad('Eliminó venta', venta ? (getProduct(venta.productoId)||{}).nombre : '');
      showToast('Venta eliminada');
      renderVentaBody();
    });
  });
}

// ============ VENTAS POR DÍA ============
let vpdDesde = null, vpdHasta = null;
function renderVentasPorDia(root){
  if(!vpdDesde){
    const dates = DATA.sales.map(s=>s.fecha).filter(Boolean).sort();
    vpdDesde = dates.length ? dates[0] : todayStr();
    vpdHasta = todayStr();
  }
  root.innerHTML = `
    <div class="card">
      <h2>Ventas por rango de fechas</h2>
      <p class="sub">Elige el rango y la tabla se actualiza sola.</p>
      <div class="form-grid" style="max-width:420px;">
        <div class="field">
          <label>Desde</label>
          <input type="date" id="vpdDesde" value="${vpdDesde}">
        </div>
        <div class="field">
          <label>Hasta</label>
          <input type="date" id="vpdHasta" value="${vpdHasta}">
        </div>
      </div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px;">
      <div class="kpi positive">
        <div class="kpi-label">Total vendido en el rango</div>
        <div class="kpi-value" id="vpdTotal">—</div>
      </div>
      <div class="kpi positive">
        <div class="kpi-label">Ganancia en el rango</div>
        <div class="kpi-value" id="vpdGanancia">—</div>
      </div>
    </div>
    <div class="card">
      <h2>Detalle por producto</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Producto</th><th class="right">Cantidad vendida (unidades)</th><th class="right">Total vendido</th></tr></thead>
          <tbody id="vpdBody"></tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById('vpdDesde').addEventListener('change', e=>{ vpdDesde = e.target.value; renderVpdResults(); });
  document.getElementById('vpdHasta').addEventListener('change', e=>{ vpdHasta = e.target.value; renderVpdResults(); });
  renderVpdResults();
}

function renderVpdResults(){
  const inRange = DATA.sales.filter(s => s.fecha && s.fecha >= vpdDesde && s.fecha <= vpdHasta);
  let total = 0, ganancia = 0;
  const byProduct = new Map();
  inRange.forEach(s=>{
    const prod = getProduct(s.productoId);
    const t = saleTotal(s, prod);
    const g = saleProfit(s, prod);
    const units = unitsFromSale(s, prod);
    total += t; ganancia += g;
    const key = prod ? prod.id : 'desconocido';
    const name = prod ? prod.nombre : 'Producto eliminado';
    if(!byProduct.has(key)) byProduct.set(key, {name, units:0, total:0});
    const entry = byProduct.get(key);
    entry.units += units;
    entry.total += t;
  });

  document.getElementById('vpdTotal').textContent = fmt(total);
  document.getElementById('vpdGanancia').textContent = fmt(ganancia);

  const tbody = document.getElementById('vpdBody');
  const rows = [...byProduct.values()].sort((a,b)=>b.total-a.total);
  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="3" class="empty">No hay ventas en ese rango.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r=>`<tr>
    <td data-label="Producto">${r.name}</td>
    <td class="right num" data-label="Cant. vendida">${fmtNum(r.units)}</td>
    <td class="right num" data-label="Total vendido">${fmt(r.total)}</td>
  </tr>`).join('');
}
